[project]
name = "nvs"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pyinstaller>=6.22.3",
    "pyside6-essentials>=6.12.0",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]
